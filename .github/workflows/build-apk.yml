name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Read Version Metadata
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Release Signing Keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release-keystore.p12"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-floatingvolume}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PASS="floatingvolume-ci-key"
            keytool -genkeypair -v               -keystore "$KEYSTORE_FILE"               -storetype PKCS12               -storepass "$EPHEMERAL_PASS"               -alias floatingvolume               -keypass "$EPHEMERAL_PASS"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=FloatingVolume, OU=Android, O=FloatingVolume, L=Unknown, S=Unknown, C=US"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=floatingvolume" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
          fi
      - name: Build Signed Release APK
        run: gradle assembleRelease
      - name: Package Versioned Release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FloatingVolume-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}-release.apk"
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-volume-release-apk
          path: dist/*.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Floating Volume v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }})
          files: dist/*.apk
          make_latest: true
