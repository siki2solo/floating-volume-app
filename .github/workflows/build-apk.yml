name: Build & Release Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Dual-Path PKCS12 Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository PKCS12 keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.p12
            echo "RELEASE_KEYSTORE_PATH=release.p12" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 not set; generating ephemeral PKCS12 signing keystore..."
            keytool -genkeypair -v \
              -keystore app/release.p12 \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias expense-ledger-key \
              -storepass expenseledger \
              -keypass expenseledger \
              -dname "CN=Expense Ledger, OU=Mobile, O=Ledger, L=Local, ST=State, C=IN"
            echo "RELEASE_KEYSTORE_PATH=release.p12" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=expenseledger" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=expense-ledger-key" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=expenseledger" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Extract Version Metadata from app/build.gradle.kts
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Parsed release metadata: v$VERSION_NAME ($VERSION_CODE)"

      - name: Rename Signed Release APK
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/release/app-release.apk "dist-apk/expense-ledger-v${{ steps.meta.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-ledger-v${{ steps.meta.outputs.version_name }}-apk
          path: dist-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: Expense Ledger v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          files: dist-apk/*.apk
          generate_release_notes: true
